<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<meta name="theme-color" content="#13132a" />
	<title>Video Wall (2 Screens)</title>
	<style>
		/* Target: Chrome 28 (oldest supported signage webview).
		   Three modern features are therefore avoided throughout:
		     - CSS custom properties (Chrome 49+) — the palette below is inlined.
		     - clamp() (Chrome 79+) — sizes step at a 1280px media query instead.
		     - flexbox gap (Chrome 84+) — every gap is a margin on the child.
		   Flex properties also need the -webkit- prefix, which Chrome 21-28 requires.

		   Palette: bg #13132a · surface #1e1e3d · accent #fdc400 · text #f4f4f8
		            muted #a6a6c8 · border rgba(255,255,255,.08) · warn #f5a623 · error #ff6b6b */

		*,
		*::before,
		*::after {
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			background-color: #13132a;
			color: #f4f4f8;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		.app {
			display: -webkit-flex;
			display: flex;
			-webkit-flex-direction: column;
			flex-direction: column;
			height: 100vh;
			max-width: 1800px;
			margin: 0 auto;
			padding: 1.5rem;
			padding-bottom: 2.5rem;
		}

		/* Stands in for `.app { gap }`. */
		.app > * + * {
			margin-top: 1.5rem;
		}

		/* ---------- Header ---------- */
		.app__header {
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: flex-start;
			align-items: flex-start;
			-webkit-justify-content: space-between;
			justify-content: space-between;
			-webkit-flex-wrap: wrap;
			flex-wrap: wrap;
			padding-bottom: 1rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
		}

		.brand {
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: stretch;
			align-items: stretch;
			min-width: 0;
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			/* Stands in for `.app__header { gap }`. Kept as padding rather than a
			   margin so it never lands on the outside edge when the header wraps. */
			padding-right: 1.5rem;
		}

		.brand__mark {
			-webkit-flex: none;
			flex: none;
			width: 6px;
			border-radius: 999px;
			background-color: #fdc400;
			/* Stands in for `.brand { gap }`. */
			margin-right: 1rem;
		}

		.brand__text {
			min-width: 0;
		}

		.brand__title {
			margin: 0;
			font-size: 1.5rem;
			font-weight: 700;
			letter-spacing: -0.01em;
		}

		/* ---------- Device info (top-right) ---------- */
		.device-info {
			-webkit-flex: none;
			flex: none;
			display: -webkit-flex;
			display: flex;
			-webkit-flex-wrap: wrap;
			flex-wrap: wrap;
			-webkit-justify-content: flex-end;
			justify-content: flex-end;
		}

		.device-info__item {
			text-align: right;
		}

		/* Stands in for `.device-info { gap }`. Without it the firmware, model and
		   type values render as one unbroken string. */
		.device-info__item + .device-info__item {
			margin-left: 1.25rem;
		}

		.device-info__label {
			margin: 0 0 0.35rem;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #fdc400;
		}

		.device-info__value {
			margin: 0;
			font-size: 1.1rem;
			font-weight: 700;
			line-height: 1.2;
			-webkit-font-feature-settings: "tnum";
			font-feature-settings: "tnum";
		}

		/* ---------- Playback status ---------- */
		.stage {
			-webkit-flex: none;
			flex: none;
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: center;
			align-items: center;
			-webkit-justify-content: space-between;
			justify-content: space-between;
			-webkit-flex-wrap: wrap;
			flex-wrap: wrap;
			padding: 1.1rem 1.25rem;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 14px;
			background-color: #1e1e3d;
		}

		.stage__item {
			min-width: 0;
		}

		/* Stands in for `.stage { gap }`. */
		.stage__item + .stage__item {
			margin-left: 1rem;
		}

		.stage__item--now {
			text-align: right;
		}

		.stage__label {
			margin: 0 0 0.35rem;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #fdc400;
		}

		.stage__value {
			margin: 0;
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: center;
			align-items: center;
			font-size: 1.3rem;
			font-weight: 700;
			line-height: 1.2;
			-webkit-font-feature-settings: "tnum";
			font-feature-settings: "tnum";
		}

		.stage__item--now .stage__value {
			-webkit-justify-content: flex-end;
			justify-content: flex-end;
		}

		.stage__dot {
			-webkit-flex: none;
			flex: none;
			width: 0.85rem;
			height: 0.85rem;
			border-radius: 50%;
			background-color: #fdc400;
			/* Stands in for `.stage__value { gap }`. */
			margin-right: 0.7rem;
		}

		.stage__dot--warn {
			background-color: #f5a623;
		}

		.stage__dot--error {
			background-color: #ff6b6b;
		}

		/* ---------- System log ---------- */
		.log {
			display: -webkit-flex;
			display: flex;
			-webkit-flex-direction: column;
			flex-direction: column;
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			min-height: 220px;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 14px;
			background-color: #1e1e3d;
			overflow: hidden;
		}

		.log__header {
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: center;
			align-items: center;
			padding: 0.9rem 1.25rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
			font-size: 0.8rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #a6a6c8;
		}

		.log__header::before {
			content: "";
			width: 0.55rem;
			height: 0.55rem;
			border-radius: 50%;
			background-color: #fdc400;
			/* Stands in for `.log__header { gap }`. */
			margin-right: 0.6rem;
		}

		.log__body {
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			min-height: 0;
			margin: 0;
			padding: 1rem 1.25rem;
			overflow-y: auto;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 0.9rem;
			line-height: 1.7;
			list-style: none;
		}

		.log__line {
			display: -webkit-flex;
			display: flex;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.log__time {
			-webkit-flex: none;
			flex: none;
			color: #a6a6c8;
			/* Stands in for `.log__line { gap }`. */
			margin-right: 0.85rem;
		}

		.log__message {
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			min-width: 0;
			color: #f4f4f8;
		}

		.log__message--warn {
			color: #f5a623;
		}

		.log__message--error {
			color: #ff6b6b;
		}

		/* ---------- Mode / phase ---------- */
		/* Startup view (while syncing and caching). The .app container — and with
		   it the header (title + device info) — is shown by default; production
		   shows ONLY the header, the stage and log are debug-only. */
		.stage,
		.log {
			display: none;
		}

		.mode-debug .stage,
		.mode-debug .log {
			display: -webkit-flex;
			display: flex;
		}

		/* Once playback starts (production and debug alike), hide the whole
		   dashboard and let the native video layer own the display. In debug, an
		   error removes `is-playing` (see log()), bringing the dashboard back so
		   the failure is never hidden. */
		.is-playing .app {
			display: none;
		}

		.is-playing body {
			background-color: transparent;
		}

		/* ---------- Large displays ---------- */
		/* Stands in for the upper bound of the clamp() sizes this design started
		   from. Below 1280px the base sizes above apply. */
		@media (min-width: 1280px) {
			.app {
				padding: 3rem;
				padding-bottom: 4rem;
			}

			.app > * + * {
				margin-top: 2.5rem;
			}

			.app__header {
				padding-bottom: 1.75rem;
			}

			.brand {
				padding-right: 3rem;
			}

			.brand__title {
				font-size: 2.5rem;
			}

			.device-info__item + .device-info__item {
				margin-left: 2.5rem;
			}

			.device-info__value {
				font-size: 1.4rem;
			}

			.stage {
				padding: 1.75rem 1.9rem;
			}

			.stage__item + .stage__item {
				margin-left: 2.5rem;
			}

			.stage__value {
				font-size: 2rem;
			}
		}
	</style>
</head>

<body>
	<div class="app">
		<header class="app__header">
			<div class="brand">
				<span class="brand__mark" aria-hidden="true"></span>
				<div class="brand__text">
					<h1 class="brand__title">Video Wall (2 Screens)</h1>
				</div>
			</div>

			<div class="device-info" aria-label="Device information">
				<div class="device-info__item">
					<p class="device-info__label">Firmware version</p>
					<p class="device-info__value" id="firmware-version">—</p>
				</div>
				<div class="device-info__item">
					<p class="device-info__label">Model</p>
					<p class="device-info__value" id="device-model">—</p>
				</div>
				<div class="device-info__item">
					<p class="device-info__label">Type</p>
					<p class="device-info__value" id="device-type">—</p>
				</div>
			</div>
		</header>

		<section class="stage" aria-label="Playback status">
			<div class="stage__item">
				<p class="stage__label">Status</p>
				<p class="stage__value">
					<span class="stage__dot" id="sync-dot" aria-hidden="true"></span>
					<span id="sync-status">Starting…</span>
				</p>
			</div>
			<div class="stage__item stage__item--now">
				<p class="stage__label">Now playing</p>
				<p class="stage__value" id="now-playing">—</p>
			</div>
		</section>

		<section class="log" aria-label="Log">
			<div class="log__header">Log</div>
			<ul class="log__body" id="log"></ul>
		</section>
	</div>

	<script type="application/ecmascript">
		// ES5 only — Chrome 28 has no async/await, arrow functions, template
		// literals, let/const, spread or destructuring. Promises come from the
		// signageOS SDK and are chained with .then(); the Promise constructor is
		// never used, since Chrome gained it only in 32.
		(function () {
			var logEl = document.getElementById('log');
			var firmwareEl = document.getElementById('firmware-version');
			var modelEl = document.getElementById('device-model');
			var typeEl = document.getElementById('device-type');
			var statusEl = document.getElementById('sync-status');
			var dotEl = document.getElementById('sync-dot');
			var nowPlayingEl = document.getElementById('now-playing');
			var started = false;
			var debugMode = false;

			function errorMessage(error) {
				return error && error.message ? error.message : String(error);
			}

			// Stands in for Array.prototype.findIndex (Chrome 45+).
			function indexOfUid(list, uid) {
				for (var i = 0; i < list.length; i++) {
					if (list[i].uid === uid) {
						return i;
					}
				}
				return -1;
			}

			// Parse and validate the `items` config (JSON array of {uid, uri} objects).
			// Each screen is configured with its own pre-sliced segments, so there is no
			// built-in playlist to fall back on.
			function parseItems(raw) {
				var items;
				var seen = {};
				var i;

				if (!raw) {
					throw new Error('`items` is not set — configure this screen\'s video segments, e.g. [{"uid":"video-1.mp4","uri":"https://…/left-1.mp4"}].');
				}
				try {
					items = JSON.parse(raw);
				} catch (parseError) {
					throw new Error('`items` is not valid JSON — use double-quoted keys and values, e.g. [{"uid":"video-1.mp4","uri":"https://…/left-1.mp4"}]. (' + parseError.message + ')');
				}
				if (!Array.isArray(items)) {
					throw new Error('`items` must be a JSON array, e.g. [{"uid":"video-1.mp4","uri":"https://…/left-1.mp4"}].');
				}
				if (!items.length) {
					throw new Error('`items` is empty — add at least one segment, e.g. [{"uid":"video-1.mp4","uri":"https://…/left-1.mp4"}].');
				}

				for (i = 0; i < items.length; i++) {
					// A bad entry is never skipped: every screen in the sync group has to wait
					// on the same uids in the same order, so a short or reordered list on one
					// screen desynchronises the whole wall.
					if (!items[i] || !items[i].uid || !items[i].uri) {
						throw new Error('`items[' + i + ']` needs both "uid" and "uri" — every screen in the group must queue the same uids in the same order.');
					}
					// hasOwnProperty, not `seen[uid]` — a uid like "constructor" would inherit a
					// truthy value straight off Object.prototype.
					if (Object.prototype.hasOwnProperty.call(seen, items[i].uid)) {
						throw new Error('`items` repeats the uid "' + items[i].uid + '" — sync barriers are keyed by uid, so every segment needs a distinct one.');
					}
					seen[items[i].uid] = true;
				}
				return items;
			}

			// Append a timestamped line to the on-screen log (visible in debug mode).
			function log(message, level) {
				var line = document.createElement('li');
				line.className = 'log__line';

				var time = document.createElement('span');
				time.className = 'log__time';
				time.textContent = new Date().toTimeString().slice(0, 8);

				var text = document.createElement('span');
				text.className = level ? 'log__message log__message--' + level : 'log__message';
				text.textContent = message;

				line.appendChild(time);
				line.appendChild(text);
				logEl.appendChild(line);

				if (debugMode && level === 'error') {
					document.documentElement.className = 'mode-debug';
				}

				while (logEl.childNodes.length > 200) {
					logEl.removeChild(logEl.firstChild);
				}

				logEl.scrollTop = logEl.scrollHeight;
			}

			function setStatus(text, level) {
				statusEl.textContent = text;
				dotEl.className = level ? 'stage__dot stage__dot--' + level : 'stage__dot';
			}

			function handleError(error) {
				setStatus('Error', 'error');
				log('Error: ' + errorMessage(error), 'error');
			}

			function loadDeviceInfo() {
				return sos.management.firmware.getVersion().then(function (firmware) {
					firmwareEl.textContent = firmware;
					log('Firmware version: ' + firmware);
					return sos.management.supports('MODEL');
				}).then(function (isModelSupported) {
					return isModelSupported ? sos.management.getModel() : 'Not supported';
				}).then(function (model) {
					modelEl.textContent = model;
					log('Model: ' + model);
					return sos.management.app.getType();
				}).then(function (type) {
					typeEl.textContent = type;
					log('Type: ' + type);
				}).catch(function (error) {
					log('Could not read device information: ' + errorMessage(error), 'warn');
				});
			}

			function startApplet() {
				if (started) {
					return;
				}
				started = true;

				var videos;
				var syncGroup;
				var previousVideoIndex;
				var currentVideoIndex = 0;
				var preparedVideoIndex = -1;

				// One pass of the playback loop. The original `while (true)` with awaits
				// is not available on ES5; chaining `return playPass()` instead would
				// leave one pending promise per video alive for the lifetime of the
				// applet, so each pass is scheduled detached and carries its own catch.
				function playPass() {
					var previousVideo = typeof previousVideoIndex === 'undefined' ? undefined : videos[previousVideoIndex];
					var currentVideo = videos[currentVideoIndex];
					var realCurrentVideoUid;
					var realCurrentVideoIndex;
					var nextVideoIndex;
					var syncedAt;
					var endedPromise;

					log('Waiting for sync: ' + currentVideo.uid + '…');

					sos.sync.wait(currentVideo.uid, syncGroup).then(function (syncedUid) {
						realCurrentVideoUid = syncedUid;
						syncedAt = new Date().getTime();
						realCurrentVideoIndex = indexOfUid(videos, realCurrentVideoUid);

						// Stop a previously prepared video that is now neither playing nor
						// about to play, so it doesn't hold a decoder open.
						if (preparedVideoIndex >= 0 && preparedVideoIndex !== realCurrentVideoIndex && preparedVideoIndex !== previousVideoIndex) {
							var preparedVideo = videos[preparedVideoIndex];
							log('Stopping stale prepared video ' + preparedVideo.uid + '.');
							return sos.video.stop.apply(sos.video, preparedVideo.arguments).then(function () {
								preparedVideoIndex = -1;
							});
						}
						return undefined;
					}).then(function () {
						// Only play when the synchronized video is the one we expected;
						// otherwise it would be out of sync — skip and resync from the next.
						if (realCurrentVideoIndex !== currentVideoIndex) {
							log('Out of sync — expected ' + currentVideo.uid + ', got ' + realCurrentVideoUid + '; resyncing from next.', 'warn');
							return undefined;
						}

						return sos.video.play.apply(sos.video, currentVideo.arguments).then(function () {
							nowPlayingEl.textContent = currentVideo.uid;
							log('Playing ' + currentVideo.uid + ' (sync→play ' + (new Date().getTime() - syncedAt) + 'ms).');

							if (previousVideo && previousVideoIndex !== currentVideoIndex) {
								return sos.video.stop.apply(sos.video, previousVideo.arguments);
							}
							return undefined;
						}).then(function () {
							previousVideoIndex = currentVideoIndex;

							// https://developers.signageos.io/sdk/sos/video#onceended
							endedPromise = sos.video.onceEnded.apply(sos.video, currentVideo.arguments);
						});
					}).then(function () {
						nextVideoIndex = (realCurrentVideoIndex + 1) % videos.length;
						var nextVideo = videos[nextVideoIndex];
						log('Preparing ' + nextVideo.uid + '.');
						return sos.video.prepare.apply(sos.video, nextVideo.arguments);
					}).then(function () {
						preparedVideoIndex = nextVideoIndex;
						return endedPromise;
					}).then(function () {
						currentVideoIndex = nextVideoIndex;
						setTimeout(playPass, 0);
					}).catch(handleError);
				}

				sos.onReady().then(function () {
					log('signageOS API ready.');

					debugMode = sos.config.mode === 'debug';
					document.documentElement.className = debugMode ? 'mode-debug' : '';
					log('Mode: ' + (debugMode ? 'debug' : 'production') + '.');

					loadDeviceInfo();

					// Cache content first — this is local prep, so in debug you can watch
					// the videos download before the wall takes over the screen.
					setStatus('Loading videos…');
					log('Loading videos…');

					// Each screen plays its own pre-sliced half, configured through `items`.
					// Both screens must list identical uids (e.g. video-1/2/3) in the same order
					// so they wait on the same sync barriers — only the uri differs per side.
					// `placement` no longer selects content; it just labels this screen.
					var placement = sos.config.placement === 'right' ? 'right' : 'left';
					videos = parseItems(sos.config.items);
					log('Placement: ' + placement + '. ' + videos.length + ' video(s) queued.');

					// Cache each video in turn, then record its play arguments.
					var cacheChain = sos.onReady();
					videos.forEach(function (video) {
						cacheChain = cacheChain.then(function () {
							// Store video to offline storage
							log('Caching ' + video.uid + '…');
							return sos.offline.cache.loadOrSaveFile(video.uid, video.uri);
						}).then(function (cachedFile) {
							video.filePath = cachedFile.filePath;
							video.arguments = [video.filePath, 0, 0, document.documentElement.clientWidth, document.documentElement.clientHeight];
						});
					});
					return cacheChain;
				}).then(function () {
					log('All videos cached.');

					document.documentElement.className = debugMode ? 'mode-debug is-playing' : 'is-playing';

					// Connect to the sync server and join the sync group
					setStatus('Syncing…');
					log('Connecting to sync server…');
					var syncServerUri = sos.config.sync_server || undefined;
					syncGroup = sos.config.sync_group || undefined;
					return sos.sync.connect(syncServerUri ? { engine: 'sync-server', uri: syncServerUri } : undefined);
				}).then(function () {
					return sos.sync.joinGroup({ groupName: syncGroup });
				}).then(function () {
					log('Synchronized (group: ' + (syncGroup || 'default') + ').');

					setStatus('Playing');
					log('Playing at ' + document.documentElement.clientWidth + '×' + document.documentElement.clientHeight + '.');

					playPass();
				}).catch(handleError);
			}

			log('Applet loaded.');

			if (typeof sos !== 'undefined') {
				startApplet();
			} else {
				window.addEventListener('sos.loaded', startApplet);
			}
		})();
	</script>
</body>

</html>
