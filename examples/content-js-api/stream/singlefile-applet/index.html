<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<meta name="theme-color" content="#13132a" />
	<title>Stream</title>
	<style>
		/* Target: Chrome 28 (oldest supported signage webview).
		   Three modern features are therefore avoided throughout:
		     - CSS custom properties (Chrome 49+) — the palette below is inlined.
		     - clamp() (Chrome 79+) — sizes step at a 1280px media query instead.
		     - flexbox gap (Chrome 84+) — every gap is a margin on the child.
		   Flex properties also need the -webkit- prefix, which Chrome 21-28 requires.

		   Palette: bg #13132a · surface #1e1e3d · accent #fdc400 · text #f4f4f8
		            muted #a6a6c8 · border rgba(255,255,255,.08) · warn #f5a623 · error #ff6b6b */

		*,
		*::before,
		*::after {
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			background-color: #13132a;
			color: #f4f4f8;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		.app {
			display: -webkit-flex;
			display: flex;
			-webkit-flex-direction: column;
			flex-direction: column;
			height: 100vh;
			max-width: 1800px;
			margin: 0 auto;
			padding: 1.5rem;
			padding-bottom: 2.5rem;
		}

		/* Stands in for `.app { gap }`. */
		.app > * + * {
			margin-top: 1.5rem;
		}

		/* ---------- Header ---------- */
		.app__header {
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: flex-start;
			align-items: flex-start;
			-webkit-justify-content: space-between;
			justify-content: space-between;
			-webkit-flex-wrap: wrap;
			flex-wrap: wrap;
			padding-bottom: 1rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
		}

		.brand {
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: stretch;
			align-items: stretch;
			min-width: 0;
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			/* Stands in for `.app__header { gap }`. Kept as padding rather than a
			   margin so it never lands on the outside edge when the header wraps. */
			padding-right: 1.5rem;
		}

		.brand__mark {
			-webkit-flex: none;
			flex: none;
			width: 6px;
			border-radius: 999px;
			background-color: #fdc400;
			/* Stands in for `.brand { gap }`. */
			margin-right: 1rem;
		}

		.brand__text {
			min-width: 0;
		}

		.brand__title {
			margin: 0;
			font-size: 1.5rem;
			font-weight: 700;
			letter-spacing: -0.01em;
		}

		/* ---------- Device info (top-right) ---------- */
		.device-info {
			-webkit-flex: none;
			flex: none;
			display: -webkit-flex;
			display: flex;
			-webkit-flex-wrap: wrap;
			flex-wrap: wrap;
			-webkit-justify-content: flex-end;
			justify-content: flex-end;
		}

		.device-info__item {
			text-align: right;
		}

		/* Stands in for `.device-info { gap }`. Without it the firmware, model and
		   type values render as one unbroken string. */
		.device-info__item + .device-info__item {
			margin-left: 1.25rem;
		}

		.device-info__label {
			margin: 0 0 0.35rem;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #fdc400;
		}

		.device-info__value {
			margin: 0;
			font-size: 1.1rem;
			font-weight: 700;
			line-height: 1.2;
			-webkit-font-feature-settings: "tnum";
			font-feature-settings: "tnum";
		}

		/* ---------- Stream status ---------- */
		.stage {
			-webkit-flex: none;
			flex: none;
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: center;
			align-items: center;
			-webkit-justify-content: space-between;
			justify-content: space-between;
			-webkit-flex-wrap: wrap;
			flex-wrap: wrap;
			padding: 1.1rem 1.25rem;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 14px;
			background-color: #1e1e3d;
		}

		.stage__item {
			min-width: 0;
		}

		/* Stands in for `.stage { gap }`. */
		.stage__item + .stage__item {
			margin-left: 1rem;
		}

		.stage__item--protocol {
			text-align: right;
		}

		.stage__label {
			margin: 0 0 0.35rem;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #fdc400;
		}

		.stage__value {
			margin: 0;
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: center;
			align-items: center;
			font-size: 1.3rem;
			font-weight: 700;
			line-height: 1.2;
			-webkit-font-feature-settings: "tnum";
			font-feature-settings: "tnum";
		}

		.stage__item--protocol .stage__value {
			-webkit-justify-content: flex-end;
			justify-content: flex-end;
		}

		.stage__dot {
			-webkit-flex: none;
			flex: none;
			width: 0.85rem;
			height: 0.85rem;
			border-radius: 50%;
			background-color: #fdc400;
			/* Stands in for `.stage__value { gap }`. */
			margin-right: 0.7rem;
		}

		.stage__dot--warn {
			background-color: #f5a623;
		}

		.stage__dot--error {
			background-color: #ff6b6b;
		}

		/* ---------- System log ---------- */
		.log {
			display: -webkit-flex;
			display: flex;
			-webkit-flex-direction: column;
			flex-direction: column;
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			min-height: 220px;
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 14px;
			background-color: #1e1e3d;
			overflow: hidden;
		}

		.log__header {
			display: -webkit-flex;
			display: flex;
			-webkit-align-items: center;
			align-items: center;
			padding: 0.9rem 1.25rem;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
			font-size: 0.8rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #a6a6c8;
		}

		.log__header::before {
			content: "";
			width: 0.55rem;
			height: 0.55rem;
			border-radius: 50%;
			background-color: #fdc400;
			/* Stands in for `.log__header { gap }`. */
			margin-right: 0.6rem;
		}

		.log__body {
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			min-height: 0;
			margin: 0;
			padding: 1rem 1.25rem;
			overflow-y: auto;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 0.9rem;
			line-height: 1.7;
			list-style: none;
		}

		.log__line {
			display: -webkit-flex;
			display: flex;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.log__time {
			-webkit-flex: none;
			flex: none;
			color: #a6a6c8;
			/* Stands in for `.log__line { gap }`. */
			margin-right: 0.85rem;
		}

		.log__message {
			-webkit-flex: 1 1 auto;
			flex: 1 1 auto;
			min-width: 0;
			color: #f4f4f8;
		}

		.log__message--warn {
			color: #f5a623;
		}

		.log__message--error {
			color: #ff6b6b;
		}

		/* ---------- Mode (config) ---------- */
		/* The stream-status stage and the log console are shown only in debug mode;
		   production shows only the header (the title and device-info section). */
		.stage,
		.log {
			display: none;
		}

		.mode-debug .stage,
		.mode-debug .log {
			display: -webkit-flex;
			display: flex;
		}

		.is-playing body {
			background-color: transparent;
		}

		/* ---------- Large displays ---------- */
		/* Stands in for the upper bound of the clamp() sizes this design started
		   from. Below 1280px the base sizes above apply. */
		@media (min-width: 1280px) {
			.app {
				padding: 3rem;
				padding-bottom: 4rem;
			}

			.app > * + * {
				margin-top: 2.5rem;
			}

			.app__header {
				padding-bottom: 1.75rem;
			}

			.brand {
				padding-right: 3rem;
			}

			.brand__title {
				font-size: 2.5rem;
			}

			.device-info__item + .device-info__item {
				margin-left: 2.5rem;
			}

			.device-info__value {
				font-size: 1.4rem;
			}

			.stage {
				padding: 1.75rem 1.9rem;
			}

			.stage__item + .stage__item {
				margin-left: 2.5rem;
			}

			.stage__value {
				font-size: 2rem;
			}
		}
	</style>
</head>

<body>
	<div class="app">
		<header class="app__header">
			<div class="brand">
				<span class="brand__mark" aria-hidden="true"></span>
				<div class="brand__text">
					<h1 class="brand__title">Stream</h1>
				</div>
			</div>

			<div class="device-info" aria-label="Device information">
				<div class="device-info__item">
					<p class="device-info__label">Firmware version</p>
					<p class="device-info__value" id="firmware-version">—</p>
				</div>
				<div class="device-info__item">
					<p class="device-info__label">Model</p>
					<p class="device-info__value" id="device-model">—</p>
				</div>
				<div class="device-info__item">
					<p class="device-info__label">Type</p>
					<p class="device-info__value" id="device-type">—</p>
				</div>
			</div>
		</header>

		<section class="stage" aria-label="Stream status">
			<div class="stage__item">
				<p class="stage__label">Status</p>
				<p class="stage__value">
					<span class="stage__dot" id="stream-dot" aria-hidden="true"></span>
					<span id="stream-status">Starting…</span>
				</p>
			</div>
			<div class="stage__item stage__item--protocol">
				<p class="stage__label">Protocol</p>
				<p class="stage__value" id="stream-protocol">—</p>
			</div>
		</section>

		<section class="log" aria-label="Log">
			<div class="log__header">Log</div>
			<ul class="log__body" id="log"></ul>
		</section>
	</div>

	<script type="application/ecmascript">
		// ES5 only — Chrome 28 has no async/await, arrow functions, template
		// literals, let/const, spread or destructuring. Promises come from the
		// signageOS SDK and are chained with .then(); the Promise constructor is
		// never used, since Chrome gained it only in 32.
		(function () {
			var logEl = document.getElementById('log');
			var firmwareEl = document.getElementById('firmware-version');
			var modelEl = document.getElementById('device-model');
			var typeEl = document.getElementById('device-type');
			var protocolEl = document.getElementById('stream-protocol');
			var statusEl = document.getElementById('stream-status');
			var dotEl = document.getElementById('stream-dot');
			var started = false;
			// Module-level so setStreaming() can rebuild the root class list.
			var debugMode = false;

			function errorMessage(error) {
				return error && error.message ? error.message : String(error);
			}

			// Append a timestamped line to the on-screen log.
			function log(message, level) {
				var line = document.createElement('li');
				line.className = 'log__line';

				var time = document.createElement('span');
				time.className = 'log__time';
				time.textContent = new Date().toTimeString().slice(0, 8);

				var text = document.createElement('span');
				text.className = level ? 'log__message log__message--' + level : 'log__message';
				text.textContent = message;

				line.appendChild(time);
				line.appendChild(text);
				logEl.appendChild(line);

				while (logEl.childNodes.length > 200) {
					logEl.removeChild(logEl.firstChild);
				}

				logEl.scrollTop = logEl.scrollHeight;
			}

			function setStatus(text, level) {
				statusEl.textContent = text;
				dotEl.className = level ? 'stage__dot stage__dot--' + level : 'stage__dot';
			}

			// Drop the opaque page background while the stream is on screen, and put
			// it back once it stops, so the display is never left transparent with
			// nothing behind it.
			function setStreaming(isStreaming) {
				var classNames = debugMode ? ['mode-debug'] : [];
				if (isStreaming) {
					classNames.push('is-playing');
				}
				document.documentElement.className = classNames.join(' ');
			}

			// Turns a raw stream event type (e.g. "connected") into a readable status label.
			function formatStatus(type) {
				var text = String(type);
				return text ? text.charAt(0).toUpperCase() + text.slice(1) : 'Unknown';
			}

			// Maps a stream event type to a log/dot level so failures stand out.
			function eventLevel(type) {
				var text = String(type).toLowerCase();
				if (text.indexOf('error') !== -1) {
					return 'error';
				}
				if (text.indexOf('disconnect') !== -1 || text.indexOf('stop') !== -1) {
					return 'warn';
				}
				return undefined;
			}

			function loadDeviceInfo() {
				return sos.management.firmware.getVersion().then(function (firmware) {
					firmwareEl.textContent = firmware;
					return sos.management.supports('MODEL');
				}).then(function (isModelSupported) {
					return isModelSupported ? sos.management.getModel() : 'Not supported';
				}).then(function (model) {
					modelEl.textContent = model;
					return sos.management.app.getType();
				}).then(function (type) {
					typeEl.textContent = type;
				}).catch(function (error) {
					log('Could not read device information: ' + errorMessage(error), 'warn');
				});
			}

			function startApplet() {
				if (started) {
					return;
				}
				started = true;

				sos.onReady().then(function () {
					log('signageOS API ready.');

					debugMode = sos.config.mode === 'debug';
					setStreaming(false);
					log('Mode: ' + (debugMode ? 'debug' : 'production') + '.');

					loadDeviceInfo();

					var uri = sos.config.uri || 'https://www.rmp-streaming.com/media/bbb-360p.mp4';
					//var uri = sos.config.uri || 'rtsp://184.72.239.149/vod/mp4:BigBuckBunny_175k.mov';
					var protocolType = sos.config.protocolType || 'HTTP'; // RTSP

					protocolEl.textContent = protocolType;
					log('Source: ' + uri);
					log('Protocol: ' + protocolType);

					var width = document.documentElement.clientWidth;
					var height = document.documentElement.clientHeight;
					var streamArguments = [uri, 0, 0, width, height, { protocol: protocolType }];

					function streamEventListener(event) {
						var type = event.type;
						var eventUri = (event.srcArguments && event.srcArguments.uri) || uri;
						var level = eventLevel(type);
						setStatus(formatStatus(type), level);
						// A level means stopped, disconnected or errored — nothing is on
						// screen, so paint the background back. `prepare` has not put a
						// picture up yet either.
						if (level) {
							setStreaming(false);
						} else if (String(type).toLowerCase() !== 'prepare') {
							setStreaming(true);
						}
						log('Stream ' + type + ': ' + eventUri, level);
					}

					sos.stream.onConnected(streamEventListener);
					sos.stream.onDisconnected(streamEventListener);
					sos.stream.onError(streamEventListener);
					sos.stream.onPrepare(streamEventListener);
					sos.stream.onPlay(streamEventListener);
					sos.stream.onStop(streamEventListener);

					log('Playing stream at ' + width + '×' + height + '.');

					// Play stream forever (https://developers.signageos.io/sdk/sos/stream)
					return sos.stream.play.apply(sos.stream, streamArguments);
				}).then(function () {
					setStatus('Playing');
					setStreaming(true);
					log('Stream playing.');
				}).catch(function (error) {
					setStreaming(false);
					setStatus('Error', 'error');
					log('Error: ' + errorMessage(error), 'error');
				});
			}

			log('Applet loaded.');

			if (typeof sos !== 'undefined') {
				startApplet();
			} else {
				window.addEventListener('sos.loaded', startApplet);
			}
		})();
	</script>
</body>

</html>
