<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Supra Android apps launcher</title>
</head>
<body>
	<header id="header" class="header">
		<h1 class="header__title">Supra Android apps launcher</h1>
		<div id="apps" class="apps"></div>
		<button id="stop" class="button button--stop" disabled>Stop all</button>
		<span id="status" class="header__status" role="status">Loading Supra App Launcher SDK...</span>
	</header>
	<main class="stage">Android application renders in this area.</main>
</body>
</html>
