<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<meta name="theme-color" content="#13132a" />
	<title>Video Wall (4 Screens)</title>
	<style>
		:root {
			--bg: #13132a;
			--surface-alt: #1e1e3d;
			--accent: #fdc400;
			--text: #f4f4f8;
			--text-muted: #a6a6c8;
			--border: rgba(255, 255, 255, 0.08);
			--warn: #f5a623;
			--error: #ff6b6b;

			--font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			background-color: var(--bg);
			color: var(--text);
			font-family: var(--font-ui);
			font-size: 16px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		.app {
			display: flex;
			flex-direction: column;
			height: 100vh;
			max-width: 1800px;
			margin: 0 auto;
			padding: clamp(1.5rem, 3vw, 3rem);
			padding-bottom: clamp(2.5rem, 4vw, 4rem);
			gap: clamp(1.5rem, 3vw, 2.5rem);
		}

		/* ---------- Header ---------- */
		.app__header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: clamp(1.5rem, 4vw, 3rem);
			flex-wrap: wrap;
			padding-bottom: clamp(1rem, 2vw, 1.75rem);
			border-bottom: 1px solid var(--border);
		}

		.brand {
			display: flex;
			align-items: stretch;
			gap: 1rem;
			min-width: 0;
			flex: 1 1 auto;
		}

		.brand__mark {
			flex: none;
			width: 6px;
			border-radius: 999px;
			background-color: var(--accent);
		}

		.brand__text {
			min-width: 0;
		}

		.brand__title {
			margin: 0;
			font-size: clamp(1.5rem, 3.2vw, 2.5rem);
			font-weight: 700;
			letter-spacing: -0.01em;
		}

		/* ---------- Device info (top-right) ---------- */
		.device-info {
			flex: none;
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: clamp(1.25rem, 2.5vw, 2.5rem);
		}

		.device-info__item {
			text-align: right;
		}

		.device-info__label {
			margin: 0 0 0.35rem;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--accent);
		}

		.device-info__value {
			margin: 0;
			font-size: clamp(1.1rem, 1.8vw, 1.4rem);
			font-weight: 700;
			line-height: 1.2;
			font-variant-numeric: tabular-nums;
		}

		/* ---------- Playback status ---------- */
		.stage {
			flex: none;
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: clamp(1rem, 3vw, 2.5rem);
			padding: clamp(1.1rem, 2.2vw, 1.75rem) clamp(1.25rem, 2.5vw, 1.9rem);
			border: 1px solid var(--border);
			border-radius: 14px;
			background-color: var(--surface-alt);
		}

		.stage__item {
			min-width: 0;
		}

		.stage__item--now {
			text-align: right;
		}

		.stage__label {
			margin: 0 0 0.35rem;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--accent);
		}

		.stage__value {
			margin: 0;
			display: flex;
			align-items: center;
			gap: 0.7rem;
			font-size: clamp(1.3rem, 2.4vw, 2rem);
			font-weight: 700;
			line-height: 1.2;
			font-variant-numeric: tabular-nums;
		}

		.stage__item--now .stage__value {
			justify-content: flex-end;
		}

		.stage__dot {
			flex: none;
			width: 0.85rem;
			height: 0.85rem;
			border-radius: 50%;
			background-color: var(--accent);
		}

		.stage__dot--warn {
			background-color: var(--warn);
		}

		.stage__dot--error {
			background-color: var(--error);
		}

		/* ---------- System log ---------- */
		.log {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 220px;
			border: 1px solid var(--border);
			border-radius: 14px;
			background-color: var(--surface-alt);
			overflow: hidden;
		}

		.log__header {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.9rem 1.25rem;
			border-bottom: 1px solid var(--border);
			font-size: 0.8rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--text-muted);
		}

		.log__header::before {
			content: "";
			width: 0.55rem;
			height: 0.55rem;
			border-radius: 50%;
			background-color: var(--accent);
		}

		.log__body {
			flex: 1 1 auto;
			min-height: 0;
			margin: 0;
			padding: 1rem 1.25rem;
			overflow-y: auto;
			font-family: var(--font-mono);
			font-size: 0.9rem;
			line-height: 1.7;
			list-style: none;
		}

		.log__line {
			display: flex;
			gap: 0.85rem;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.log__time {
			flex: none;
			color: var(--text-muted);
		}

		.log__message {
			flex: 1 1 auto;
			min-width: 0;
			color: var(--text);
		}

		.log__message--warn {
			color: var(--warn);
		}

		.log__message--error {
			color: var(--error);
		}

		.stage,
		.log {
			display: none;
		}

		.mode-debug .stage,
		.mode-debug .log {
			display: flex;
		}

		.is-playing .app {
			display: none;
		}
	</style>
</head>

<body>
	<div class="app">
		<header class="app__header">
			<div class="brand">
				<span class="brand__mark" aria-hidden="true"></span>
				<div class="brand__text">
					<h1 class="brand__title">Video Wall (4 Screens)</h1>
				</div>
			</div>

			<div class="device-info" aria-label="Device information">
				<div class="device-info__item">
					<p class="device-info__label">Firmware version</p>
					<p class="device-info__value" id="firmware-version">—</p>
				</div>
				<div class="device-info__item">
					<p class="device-info__label">Model</p>
					<p class="device-info__value" id="device-model">—</p>
				</div>
				<div class="device-info__item">
					<p class="device-info__label">Type</p>
					<p class="device-info__value" id="device-type">—</p>
				</div>
			</div>
		</header>

		<section class="stage" aria-label="Playback status">
			<div class="stage__item">
				<p class="stage__label">Status</p>
				<p class="stage__value">
					<span class="stage__dot" id="sync-dot" aria-hidden="true"></span>
					<span id="sync-status">Starting…</span>
				</p>
			</div>
			<div class="stage__item stage__item--now">
				<p class="stage__label">Now playing</p>
				<p class="stage__value" id="now-playing">—</p>
			</div>
		</section>

		<section class="log" aria-label="Log">
			<div class="log__header">Log</div>
			<ul class="log__body" id="log"></ul>
		</section>
	</div>

	<script type="application/ecmascript">
		(function () {
			const logEl = document.getElementById('log');
			const firmwareEl = document.getElementById('firmware-version');
			const modelEl = document.getElementById('device-model');
			const typeEl = document.getElementById('device-type');
			const statusEl = document.getElementById('sync-status');
			const dotEl = document.getElementById('sync-dot');
			const nowPlayingEl = document.getElementById('now-playing');
			let started = false;
			// In debug mode the dashboard shows during startup, hides once playback
			// starts, and is re-revealed on any error (see log()). Module-level so log()
			// can surface the dashboard even after it has been hidden.
			let debugMode = false;

			// Append a timestamped line to the on-screen log (visible in debug mode).
			function log(message, level) {
				const line = document.createElement('li');
				line.className = 'log__line';

				const time = document.createElement('span');
				time.className = 'log__time';
				time.textContent = new Date().toTimeString().slice(0, 8);

				const text = document.createElement('span');
				text.className = level ? `log__message log__message--${level}` : 'log__message';
				text.textContent = message;

				line.appendChild(time);
				line.appendChild(text);
				logEl.appendChild(line);

				// An error must never stay hidden: if the dashboard was hidden once
				// playback started, an error-level line brings it back into view.
				if (debugMode && level === 'error') {
					document.documentElement.className = 'mode-debug';
				}

				while (logEl.childNodes.length > 200) {
					logEl.removeChild(logEl.firstChild);
				}

				logEl.scrollTop = logEl.scrollHeight;
			}

			function setStatus(text, level) {
				statusEl.textContent = text;
				dotEl.className = level ? `stage__dot stage__dot--${level}` : 'stage__dot';
			}

			async function loadDeviceInfo() {
				try {
					const firmware = await sos.management.firmware.getVersion();
					firmwareEl.textContent = firmware;
					log(`Firmware version: ${firmware}`);

					const model = (await sos.management.supports('MODEL'))
						? await sos.management.getModel()
						: 'Not supported';
					modelEl.textContent = model;
					log(`Model: ${model}`);

					const type = await sos.management.app.getType();
					typeEl.textContent = type;
					log(`Type: ${type}`);
				} catch (error) {
					log(`Could not read device information: ${error && error.message ? error.message : String(error)}`, 'warn');
				}
			}

			async function startApplet() {
				if (started) return;
				started = true;
				try {
					await sos.onReady();
					log('signageOS API ready.');

					debugMode = sos.config.mode === 'debug';
					document.documentElement.className = debugMode ? 'mode-debug' : '';
					log(`Mode: ${debugMode ? 'debug' : 'production'}.`);

					loadDeviceInfo();
					setStatus('Loading videos…');
					log('Loading videos…');

					// Video sets are sliced in pre-production — one quadrant per screen.
					// This screen plays the quadrant selected by its `placement` config.
					const videosTopLeft = [
						{
							uid: 'video-1.mp4',
							uri: 'https://static.signageos.io/assets/videowall1/videowall1-top_left_0478fd10ebd4cdc9b888db783e0810ea.mp4'
						},
						{
							uid: 'video-2.mp4',
							uri: 'https://static.signageos.io/assets/videowall2/videowall2-top-left_37a50d9ce8520bc5d1d9fa77df3c90d8.mp4'
						},
						{
							uid: 'video-3.mp4',
							uri: 'https://static.signageos.io/assets/videowall3/videowall3-top_left_5c9b686dd52629562092d393c0180288.mp4'
						},
					];
					const videosTopRight = [
						{
							uid: 'video-1.mp4',
							uri: 'https://static.signageos.io/assets/videowall1/videowall1-top_right_3be4db1ded91836bb778c2fbd8810005.mp4'
						},
						{
							uid: 'video-2.mp4',
							uri: 'https://static.signageos.io/assets/videowall2/videowall2-top-right_e9aebe3e57fe7c8e56aa95750f7bd419.mp4'
						},
						{
							uid: 'video-3.mp4',
							uri: 'https://static.signageos.io/assets/videowall3/videowall3-top_right_09cf689c776ef65560de2115a46354db.mp4'
						},
					];
					const videosBottomLeft = [
						{
							uid: 'video-1.mp4',
							uri: 'https://static.signageos.io/assets/videowall1/videowall1-bottom_left_4e7c71fbb015ed9947e379f46daf941b.mp4'
						},
						{
							uid: 'video-2.mp4',
							uri: 'https://static.signageos.io/assets/videowall2/videowall2-bottom-left_05f167d439a0fdbf48c1ae83f9b02c09.mp4'
						},
						{
							uid: 'video-3.mp4',
							uri: 'https://static.signageos.io/assets/videowall3/videowall3-bottom_left_d2fb186ee0716c13304867317db6e7dc.mp4'
						},
					];
					const videosBottomRight = [
						{
							uid: 'video-1.mp4',
							uri: 'https://static.signageos.io/assets/videowall1/videowall1-bottom_right_49db19005399d29d6872da2be7354208.mp4'
						},
						{
							uid: 'video-2.mp4',
							uri: 'https://static.signageos.io/assets/videowall2/videowall2-bottom-right_09e6b4982e9220f021bc0c37fe4eb392.mp4'
						},
						{
							uid: 'video-3.mp4',
							uri: 'https://static.signageos.io/assets/videowall3/videowall3-bottom_right_57a344c5675d5460c0f94065c3584212.mp4'
						},
					];

					// Choose this screen's quadrant based on the placement config (default top_left).
					let videos;
					switch (sos.config.placement) {
						case 'top_right':
							videos = videosTopRight;
							break;
						case 'bottom_left':
							videos = videosBottomLeft;
							break;
						case 'bottom_right':
							videos = videosBottomRight;
							break;
						case 'top_left':
						default:
							videos = videosTopLeft;
					}
					log(`Placement: ${sos.config.placement || 'top_left (default)'}. ${videos.length} video(s) queued.`);

					for (const video of videos) {
						// Store video to offline storage
						log(`Caching ${video.uid}…`);
						const { filePath } = await sos.offline.cache.loadOrSaveFile(video.uid, video.uri);
						video.filePath = filePath;
						video.arguments = [video.filePath, 0, 0, document.documentElement.clientWidth, document.documentElement.clientHeight];
					}
					log('All videos cached.');

					document.documentElement.className = debugMode ? 'mode-debug is-playing' : 'is-playing';

					// Connect to the sync server and join the sync group
					setStatus('Syncing…');
					log('Connecting to sync server…');
					const syncServerUri = sos.config.sync_server || undefined;
					const syncGroup = sos.config.sync_group || undefined;
					await sos.sync.connect(syncServerUri ? { engine: 'sync-server', uri: syncServerUri } : undefined);
					await sos.sync.joinGroup({ groupName: syncGroup });
					log(`Synchronized (group: ${syncGroup || 'default'}).`);

					setStatus('Playing');
					log(`Playing at ${document.documentElement.clientWidth}×${document.documentElement.clientHeight}.`);

					let previousVideoIndex;
					let currentVideoIndex = 0;
					let preparedVideoIndex = -1;

					while (true) {
						const previousVideo = typeof previousVideoIndex === 'undefined' ? undefined : videos[previousVideoIndex];
						const currentVideo = videos[currentVideoIndex];

						log(`Waiting for sync: ${currentVideo.uid}…`);
						const realCurrentVideoUid = await sos.sync.wait(currentVideo.uid, syncGroup);
						const syncedAt = new Date();
						const realCurrentVideoIndex = videos.findIndex((video) => video.uid === realCurrentVideoUid);

						// Stop a previously prepared video that is now neither playing nor
						// about to play, so it doesn't hold a decoder open.
						if (preparedVideoIndex >= 0 && preparedVideoIndex !== realCurrentVideoIndex && preparedVideoIndex !== previousVideoIndex) {
							const preparedVideo = videos[preparedVideoIndex];
							log(`Stopping stale prepared video ${preparedVideo.uid}.`);
							await sos.video.stop(...preparedVideo.arguments);
							preparedVideoIndex = -1;
						}

						let endedPromise;

						// Only play when the synchronized video is the one we expected;
						// otherwise it would be out of sync — skip and resync from the next.
						if (realCurrentVideoIndex === currentVideoIndex) {
							await sos.video.play(...currentVideo.arguments);
							nowPlayingEl.textContent = currentVideo.uid;
							log(`Playing ${currentVideo.uid} (sync→play ${new Date() - syncedAt}ms).`);
							if (previousVideo && previousVideoIndex !== currentVideoIndex) {
								await sos.video.stop(...previousVideo.arguments);
							}

							previousVideoIndex = currentVideoIndex;

							// https://developers.signageos.io/sdk/sos/video#onceended
							endedPromise = sos.video.onceEnded(...currentVideo.arguments);
						} else {
							log(`Out of sync — expected ${currentVideo.uid}, got ${realCurrentVideoUid}; resyncing from next.`, 'warn');
						}

						const nextVideoIndex = (realCurrentVideoIndex + 1) % videos.length;
						const nextVideo = videos[nextVideoIndex];
						log(`Preparing ${nextVideo.uid}.`);
						await sos.video.prepare(...nextVideo.arguments);
						preparedVideoIndex = nextVideoIndex;

						if (endedPromise) {
							await endedPromise;
						}

						currentVideoIndex = nextVideoIndex;
					}
				} catch (error) {
					setStatus('Error', 'error');
					log(`Error: ${error && error.message ? error.message : String(error)}`, 'error');
				}
			}

			log('Applet loaded.');

			typeof sos !== 'undefined' ?
				startApplet() :
				window.addEventListener('sos.loaded', startApplet);
		})();
	</script>
</body>

</html>
