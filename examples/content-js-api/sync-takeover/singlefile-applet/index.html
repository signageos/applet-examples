<!doctype html>
<html>

<head>
	<title>Synced Takeover Menuboard</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
		/* Base menuboard layer (always running underneath). */
		#menuboard {
			position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
			background: #101828; color: #fff;
			font-family: 'Segoe UI', system-ui, sans-serif;
			display: flex; flex-direction: column; box-sizing: border-box; padding: 4vh 6vw;
		}
		#menuboard h1 { font-size: 6vh; margin: 0 0 4vh; letter-spacing: 0.02em; }
		#clock { position: absolute; top: 4vh; right: 6vw; font-size: 4vh; opacity: 0.85; }
		.menu-row { display: flex; justify-content: space-between; align-items: baseline;
			font-size: 4.5vh; padding: 1.6vh 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
		.menu-row .price { color: #f9d34f; font-weight: 600; }
		/* Full-screen synced takeover: a big lock-step number + dark colour flip (no videos). */
		#takeover {
			position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
			visibility: hidden; background: #101828; color: #fff;
			font-family: 'Segoe UI', system-ui, sans-serif;
			display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
		}
		#takeover-num { font-size: 42vh; font-weight: 800; line-height: 1; }
		#takeover-label { font-size: 5vh; letter-spacing: 0.15em; opacity: 0.9; margin-top: 2vh; }
	</style>
</head>

<body>
	<div id="menuboard">
		<div id="clock"></div>
		<h1 id="menuboard-title">Today's Menu</h1>
		<div id="menu-rows"></div>
	</div>
	<div id="takeover">
		<div id="takeover-num">–</div>
		<div id="takeover-label">SYNCED TAKEOVER</div>
	</div>

	<script type="application/ecmascript">
		// Single-file version of the "sync-takeover" example. See the cli-applet variant for the
		// full comments. A menuboard runs on every screen; on a shared schedule the whole group is
		// taken over together by a synced number + dark colour, then returns to the menu together.
		// Two barriers (`sos.sync.wait`) keep the group aligned (enter + leave).

		// Dark, muted takeover colours — solid but easy on the eyes for a full-screen fill.
		var COLORS = ['#4a2b2b', '#2b4a38', '#2b394a', '#3d2b4a', '#4a422b', '#2b2b4a', '#2b4a4a', '#4a2b40'];
		var DEFAULT_MENU = [
			{ name: 'Espresso', price: '$3.0' },
			{ name: 'Flat White', price: '$4.2' },
			{ name: 'Cold Brew', price: '$4.5' },
			{ name: 'Croissant', price: '$3.8' },
			{ name: 'Avocado Toast', price: '$7.5' },
		];

		function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
		function parseJson(raw, fallback) {
			try { return raw ? JSON.parse(raw) : fallback; }
			catch (error) { console.error('Invalid config JSON, using default:', error); return fallback; }
		}
		function renderMenuboard(items) {
			var rows = document.getElementById('menu-rows');
			rows.innerHTML = '';
			items.forEach(function (item) {
				var row = document.createElement('div');
				row.className = 'menu-row';
				row.innerHTML = '<span class="name"></span><span class="price"></span>';
				row.querySelector('.name').textContent = item.name;
				row.querySelector('.price').textContent = item.price;
				rows.appendChild(row);
			});
		}
		function startClock() {
			var clock = document.getElementById('clock');
			function tick() {
				var d = new Date();
				clock.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
			}
			tick();
			setInterval(tick, 15000);
		}

		window.addEventListener('sos.loaded', async function () {
			await sos.onReady();

			var takeoverLayer = document.getElementById('takeover');
			var takeoverNum = document.getElementById('takeover-num');

			var syncGroup = sos.config.sync_group || undefined;
			var syncServer = sos.config.sync_server || undefined;
			var syncEngine = sos.config.sync_engine || 'sync-server';
			var intervalMs = Number(sos.config.interval_ms) || 15000;
			var takeoverMs = Number(sos.config.takeover_ms) || 6000;
			var waitTimeoutMs = Number(sos.config.wait_timeout_ms) || 15000;
			var menu = parseJson(sos.config.menuboard_items, DEFAULT_MENU);

			renderMenuboard(menu);
			startClock();

			await sos.sync.connect({ engine: syncEngine, uri: syncServer });
			await sos.sync.joinGroup({ groupName: syncGroup });

			var index = 0;
			while (true) {
				try {
					// 1) Menuboard runs for a while (the enter-barrier re-aligns the group afterwards).
					await sleep(intervalMs);

					// 2) Enter together: released with the master's index.
					var agreed = await sos.sync.wait(index, syncGroup, waitTimeoutMs);
					var shownIndex = typeof agreed === 'number' ? agreed : index;

					// 3) Show the takeover (same colour + number on every screen, at once).
					takeoverLayer.style.backgroundColor = COLORS[shownIndex % COLORS.length];
					takeoverNum.textContent = String(shownIndex);
					takeoverLayer.style.visibility = 'visible';
					await sleep(takeoverMs);

					// 4) Leave together: a second barrier returns every screen to the menuboard at once.
					await sos.sync.wait('end', syncGroup, waitTimeoutMs);
					takeoverLayer.style.visibility = 'hidden';

					index = shownIndex + 1;
				} catch (error) {
					// Recover so this screen never becomes a stuck peer that stalls the group.
					console.error('takeover cycle failed, retrying:', error && error.message);
					takeoverLayer.style.visibility = 'hidden';
					await sleep(500);
				}
			}
		});
	</script>
</body>

</html>
