stages:
  - check
  - publish
  - test

variables:
  SOS_DEVICE_UID_MILHOUSE: eb615ae33411f2e17ceb2bf767e49892ee290e95dddf8e0153a7a

check:links:
  stage: check
  image: $ECR_REGISTRY/signageos/docker:master
  script:
    - ./tools/check-links.sh

.test-applet-device:
  stage: test
  image: node:16-alpine
  when: manual
  script:
    - cd $APPLET_PATH
    - npm install
    - npm test $FILE_PATH

.test-applet-device:sos:
  stage: test
  image: node:16-alpine
  when: manual
  script:
    - cd $APPLET_PATH
    - npm install @signageos/cli -g
    - npm run test-sos $SOS_DEVICE_UID_MILHOUSE
